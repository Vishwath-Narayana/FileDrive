# Fly.io config. Create the app with `fly launch --no-deploy --copy-config`, set secrets with
# `fly secrets set KEY=value ...` (see .env.example), then `fly deploy`.
app = "filedrive-api"
primary_region = "sin"

[build]

[env]
  PORT = "5000"
  NODE_ENV = "production"

[http_service]
  internal_port = 5000
  force_https = true
  # Always-on: the API holds Socket.io connections, so it must not scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
